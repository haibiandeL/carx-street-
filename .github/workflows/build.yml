name: build
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "ndk;27.0.12077973" "cmake;3.22.1"

      - name: Build .so
        run: |
          cmake -S module/jni -B module/jni/build \
            -DCMAKE_TOOLCHAIN_FILE=$ANDROID_HOME/ndk/27.0.12077973/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-26 -DCMAKE_BUILD_TYPE=Release
          cmake --build module/jni/build --config Release

      - name: Package module zip
        run: |
          mkdir -p out/zygisk
          cp module/module.prop out/
          cp module/customize.sh out/
          cp module/jni/build/libcarxsnow.so out/zygisk/arm64-v8a.so
          cd out && zip -r ../carx_snow_control.zip .

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: carx-snow
          path: carx_snow_control.zip
